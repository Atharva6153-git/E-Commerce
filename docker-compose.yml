version: '3.8'
services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data

  catalog-db:
    image: postgres:16
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5434:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5435:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data

  cart-db:
    image: postgres:16
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5436:5432"
    volumes:
      - cart_data:/var/lib/postgresql/data

  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5437:5432"
    volumes:
      - order_data:/var/lib/postgresql/data

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5438:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data

  notification-db:
    image: postgres:16
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5439:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --- Integration test DBs (isolated from dev DBs above) ---
  # Used by order-service Jest + Supertest saga tests. Wiped/re-seeded per run.
  order-test-db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_test
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5447:5432"
    volumes:
      - order_test_data:/var/lib/postgresql/data

  inventory-test-db:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory_test
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5448:5432"
    volumes:
      - inventory_test_data:/var/lib/postgresql/data

  payment-test-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_test
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5449:5432"
    volumes:
      - payment_test_data:/var/lib/postgresql/data

volumes:
  auth_data:
  catalog_data:
  inventory_data:
  cart_data:
  order_data:
  payment_data:
  notification_data:
  redis_data:
  order_test_data:
  inventory_test_data:
  payment_test_data:

